apiVersion: v1
kind: Pod
metadata:
  name: exit-strategy-sandbox-pod 
  # namespace: it
  labels:
    app: exit-strategy-sandbox
spec:
  restartPolicy: Always
  containers:
    - name: exit-strategy-container
      image: '192.168.1.15:5000/exit_strategy:v2'
      imagePullPolicy: IfNotPresent
      securityContext:
        # privileged: true
        seccompProfile:
          type: RuntimeDefault
      resources:
        limits:
          cpu: "1"
          memory: "512Mi"
          ephemeral-storage: "5Gi"
        requests:
          cpu: "0.5"
          memory: "256Mi"
          ephemeral-storage: "2Gi"