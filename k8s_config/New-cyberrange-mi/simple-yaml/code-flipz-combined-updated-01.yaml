apiVersion: v1
kind: Secret
metadata:
  name: flipz-flag
  # namespace: it
type: Opaque
stringData:
  flag: Cyberrange{it-Arzs64iyCBIiKd1jBPPPtC0TwrwLzyCc}
---
apiVersion: v1
kind: Pod
metadata:
  name: flipz-challenge
  # namespace: it
  labels:
    app: flipz-challenge
spec:
  restartPolicy: Always  
  containers:
    - name: flipz-challenge
      image: '192.168.1.15:5000/code_flipz:latest'
      imagePullPolicy: IfNotPresent
      env:
        - name: FLAG
          valueFrom:
            secretKeyRef:
              name: flipz-flag
              key: flag
      securityContext:
        privileged: true
        seccompProfile:
          type: RuntimeDefault
      resources:
        limits:
          cpu: "1"
          memory: "512Mi"
          ephemeral-storage: "5Gi"
        requests:
          cpu: "0.5"
          memory: "256Mi"
          ephemeral-storage: "2Gi"
