apiVersion: v1
kind: Pod
metadata:
  name: askshell-sandbox-pod
  # namespace: it  # Update or remove based on your setup
  labels:
    app: askshell-sandbox
spec:
  restartPolicy: Always
  containers:
    - name: askshell-sandbox-container
      image: '192.168.1.15:5000/ctf_askshell:latest'
      imagePullPolicy: IfNotPresent
      securityContext:
        privileged: true
        # allowPrivilegeEscalation: true
        # readOnlyRootFilesystem: false
        seccompProfile:
          type: RuntimeDefault
      resources:
        limits:
          cpu: "1"
          memory: "512Mi"
          ephemeral-storage: "5Gi"
        requests:
          cpu: "0.5"
          memory: "256Mi"
          ephemeral-storage: "2Gi"