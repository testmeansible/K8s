apiVersion: v1
kind: Pod
metadata:
  name: wp-drama-sandbox-pod 
  # namespace: user1
  labels:
    app: wp-drama-sandbox
spec:
  restartPolicy: Always
  containers:
    - name: wp-drama-container
      image: '192.168.3.46:5000/wordpress:latest'
      imagePullPolicy: IfNotPresent
      securityContext:
        # privileged: true
        seccompProfile:
          type: RuntimeDefault
      command: ["/bin/sh"]
      args:
        - "-c"
        - |
          service apache2 start && \
          service mysql start && \
          tail -f /dev/null
      resources:
        limits:
          cpu: "1"
          memory: "512Mi"
          ephemeral-storage: "5Gi"
        requests:
          cpu: "0.5"
          memory: "256Mi"
          ephemeral-storage: "2Gi"