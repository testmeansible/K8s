apiVersion: v1
kind: Pod
metadata:
  name: command-denied-sandbox-pod 
  # namespace: it
  labels:
    app: command-denied-sandbox
spec:
  restartPolicy: Always
  containers:
    - name: command-denied-container
      image: '192.168.3.46:5000/command_denied:latest'
      imagePullPolicy: IfNotPresent
      securityContext:
        # privileged: true
        seccompProfile:
          type: RuntimeDefault
      resources:
        limits:
          cpu: "1"
          memory: "512Mi"
          ephemeral-storage: "5Gi"
        requests:
          cpu: "0.5"
          memory: "256Mi"
          ephemeral-storage: "2Gi"