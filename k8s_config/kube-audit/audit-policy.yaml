apiVersion: audit.k8s.io/v1
kind: Policy
rules:
  - level: Metadata
    resources:
    - group: ""
      resources: ["pods", "secrets", "configmaps", "services"]
  - level: RequestResponse
    verbs: ["create", "update", "delete"]
    resources:
    - group: ""
      resources: ["pods", "secrets"]
  - level: None
    users: ["system:kube-proxy"]
