apiVersion: apps/v1
kind: Deployment
metadata:
  name: ubuntu-privileged
  labels:
    app: ubuntu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ubuntu
  template:
    metadata:
      labels:
        app: ubuntu
    spec:
      containers:
      - name: ubuntu
        image: ubuntu:20.04
        command: ["/bin/bash", "-c", "--"]
        args: ["while true; do sleep 3600; done;"]
        tty: true
        stdin: true
        securityContext:
          capabilities:
            add: ["NET_ADMIN"]
          privileged: true
        volumeMounts:
        - name: dev-net-tun
          mountPath: /dev/net/tun
      volumes:
      - name: dev-net-tun
        hostPath:
          path: /dev/net/tun
